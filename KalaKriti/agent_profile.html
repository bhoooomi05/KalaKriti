<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalaKriti | Agent Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="agent_home.css">
  <link rel="stylesheet" href="agent_profile.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <div class="nav-brand-container" onclick="window.location.href='agent_home.html'">
        <img src="logo.png" alt="KalaKriti logo" class="logo-icon" style="height:56px;width:56px;border-radius:8px;object-fit:cover;">
        <div class="logo">
          <div class="nav-brand">KalaKriti</div>
        </div>
      </div>
      <div class="nav-right">
        <a class="profile-icon" title="Back to Dashboard" href="agent_home.html"><i class="fas fa-arrow-left"></i></a>
      </div>
    </div>
  </nav>

  <div class="dashboard">
    <section class="card" style="max-width:900px;margin:2rem auto;">
      <div class="card-header">
        <h2><i class="fas fa-user-circle"></i> My Profile</h2>
      </div>

      <form id="agentProfileForm" class="form-container show" onsubmit="handleAgentProfileSubmit(event)">
        <div class="form-grid">
          <div class="form-group" style="align-items:center;">
            <label>Avatar</label>
            <div class="file-upload" id="avatarUpload">
              <input type="file" id="avatarInput" accept="image/*">
              <label for="avatarInput" class="file-label">
                <i class="fas fa-camera-retro"></i>
                <span id="avatarLabel">Upload Avatar</span>
              </label>
              <img id="avatarPreview" class="image-preview" style="display:none;max-width:180px;max-height:180px;">
              <button type="button" id="avatarRemove" class="remove-preview" style="display:none;">×</button>
            </div>
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" id="full_name" placeholder="Your full name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="email@example.com" required readonly>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" id="phone" placeholder="+91 98765 43210">
          </div>

          <div class="form-group">
            <label>Shop / Studio Name</label>
            <input type="text" name="shop_name" id="shop_name" placeholder="Your shop or studio name">
          </div>

          <div class="form-group full-width">
            <label>Address</label>
            <input type="text" name="address" id="address" placeholder="City, State, PIN">
          </div>

          <div class="form-group full-width">
            <label>Short Bio</label>
            <textarea name="bio" id="bio" placeholder="A short bio about you and your craft..."></textarea>
          </div>

          <div class="form-group">
            <label>Bank / UPI</label>
            <input type="text" name="payout_info" id="payout_info" placeholder="UPI ID or bank summary">
          </div>

          <div class="form-group">
            <label>Website / Social</label>
            <input type="text" name="social" id="social" placeholder="Instagram / WhatsApp / Website">
          </div>

        </div>

        <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1rem;">
          <a href="agent_home.html" class="submit-btn" style="background:#ccc;color:#333;text-decoration:none;display:inline-flex;align-items:center;">Cancel</a>
          <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Save Profile</button>
        </div>

        <div id="profilePageMsg" class="message" style="margin-top:1rem;"></div>
      </form>
    </section>
  </div>

  <script src="agent_profile.js"></script>
  <script>
    // populate email from session/storage if available
    document.addEventListener('DOMContentLoaded', () => {
      const info = sessionStorage.getItem('userInfo');
      if (info) {
        try {
          const user = JSON.parse(info);
          if (user.email) document.getElementById('email').value = user.email;
          if (user.username) document.getElementById('full_name').value = user.username;
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
